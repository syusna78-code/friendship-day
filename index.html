<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Friendship Day</title>

<link rel="stylesheet" href="style.css">

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<!-- Sakura Petals -->
<div class="petals"></div>

<!-- Sparkles -->
<div class="sparkles"></div>

<!-- Main Card -->
<div class="container">

    <h1>🌸 Happy Friendship Day 🌸</h1>

    <p class="subtitle">
        A special surprise is waiting just for you...
    </p>

    <!-- Bouquet -->
    <div class="bouquet">
        <img src="https://images.unsplash.com/photo-1520763185298-1b434c919102?w=600" alt="Bouquet">
    </div>
<input
    type="text"
    id="friendName"
    placeholder="Enter Your Name"
    maxlength="30"
>

<br><br>
    <button onclick="openLetter()">
        🎁 Open Gift
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
